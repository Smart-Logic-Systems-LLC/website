---
- name: Deploy slswebsite WordPress to vm as k8s quadlet
  become: true
  hosts: all
  gather_facts: false
  vars_files: "../env/{{ environment_level }}.yml"
  pre_tasks:
    - name: Wait for host to become reachable
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 300
  tasks:
    - name: Create quadlet
      ansible.builtin.include_role:
        name: slswebsite_k8s
        tasks_from: create_quadlet.yml
...
