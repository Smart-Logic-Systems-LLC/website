[defaults]
roles_path = ./roles
interpreter_python = /usr/bin/python3

[ssh_connection]
# Trust the VM's host key on first connect and pin it per environment;
# `make infra-destroy` forgets it.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=.known_hosts
pipelining = True
